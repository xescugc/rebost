<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="100%" stop-color="#0C0A18"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#bg)" rx="12"/>
  <polygon points="50,29 26,71 74,71" fill="#7C3AED" fill-opacity=".07"/>
  <!-- edges -->
  <line x1="50" y1="29" x2="26" y2="71" stroke="#8B5CF6" stroke-width="1.2" opacity=".75" filter="url(#eg)"/>
  <line x1="50" y1="29" x2="74" y2="71" stroke="#8B5CF6" stroke-width="1.2" opacity=".75" filter="url(#eg)"/>
  <line x1="26" y1="71" x2="74" y2="71" stroke="#8B5CF6" stroke-width="1.2" opacity=".75" filter="url(#eg)"/>
  <!-- node top -->
  <circle cx="50" cy="29" r="10" fill="#7C3AED" fill-opacity=".1" filter="url(#glow)"/>
  <circle cx="50" cy="29" r="6"  fill="none" stroke="#7C3AED" stroke-width="1.4" filter="url(#glow)"/>
  <circle cx="50" cy="29" r="3.2" fill="#8B5CF6" fill-opacity=".9"/>
  <circle cx="50" cy="29" r="1.4" fill="#C4B5FD"/>
  <!-- node bottom-left -->
  <circle cx="26" cy="71" r="10" fill="#7C3AED" fill-opacity=".1" filter="url(#glow)"/>
  <circle cx="26" cy="71" r="6"  fill="none" stroke="#7C3AED" stroke-width="1.4" filter="url(#glow)"/>
  <circle cx="26" cy="71" r="3.2" fill="#8B5CF6" fill-opacity=".9"/>
  <circle cx="26" cy="71" r="1.4" fill="#C4B5FD"/>
  <!-- node bottom-right -->
  <circle cx="74" cy="71" r="10" fill="#7C3AED" fill-opacity=".1" filter="url(#glow)"/>
  <circle cx="74" cy="71" r="6"  fill="none" stroke="#7C3AED" stroke-width="1.4" filter="url(#glow)"/>
  <circle cx="74" cy="71" r="3.2" fill="#8B5CF6" fill-opacity=".9"/>
  <circle cx="74" cy="71" r="1.4" fill="#C4B5FD"/>
</svg>
